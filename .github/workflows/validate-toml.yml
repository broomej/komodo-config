name: Validate TOML

# Parses every .toml file in the repo on every PR to main and on every push.
# Komodo itself will also reject bad TOML at sync time, but this gives a
# faster feedback loop with line-precise errors right in the PR check.
#
# The actual validator is a standalone script at scripts/validate-toml.py.
# Run it locally with the same command:
#   python scripts/validate-toml.py

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate-toml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate TOML files
        run: python scripts/validate-toml.py
